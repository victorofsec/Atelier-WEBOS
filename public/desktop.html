<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#34483e"><meta name="description" content="Atelier — your personal desktop, with files, music, photos and everything in its place."><title>Atelier — Your Space</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" crossorigin="use-credentials" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="desktop.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="upgrade.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="workspace.css"></head><body class="booting"><section id="boot-screen" aria-label="Starting Atelier"><div class="boot-card"><div class="boot-symbol" aria-hidden="true">◇</div><h1>ATELIER</h1><progress max="4" value="0" aria-label="Startup progress"></progress><p data-boot-label role="status">Preparing your desktop…</p><button data-boot-retry hidden>Reload</button></div></section><main id="desktop"><header id="menubar"><div class="menu-left"><button id="system-menu" aria-label="Atelier menu" class="brand"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z" fill="currentColor"/><path d="m12 7 5 5-5 5-5-5Z" fill="#e5ede7"/></svg></button><b id="active-app">Finder</b><button data-menu="file">File</button><button data-menu="view">View</button><button data-menu="window">Window</button></div><div class="menu-right"><button id="full-btn" title="Full Screen" aria-label="Full Screen">⛶</button><button id="search-btn" title="Search (Ctrl+Space)" aria-label="Search"></button><button id="control-btn" title="Control Center" aria-label="Control Center"></button><button id="clock" title="Lock Screen"></button></div></header><div id="desktop-files" role="listbox" aria-label="Desktop files" aria-multiselectable="true"></div><div id="windows"></div><nav id="dock" aria-label="Applications"></nav><div id="context" class="popover hidden"></div><div id="control" class="popover hidden"></div><div id="toast" role="status"></div><section id="search" class="overlay hidden"><div class="search-panel"><input id="global-search" placeholder="Search apps and files…" autocomplete="off"><div id="search-results"></div><footer>↑ ↓ to navigate · Enter to open · Escape to close</footer></div></section><section id="launchpad" class="hidden"><input id="launch-search" placeholder="Search applications" aria-label="Search applications"><div id="launch-grid"></div><small>Click outside to return to your desktop</small></section><section id="lock" class="hidden"><div class="lock-top"><div id="lock-date"></div><div id="lock-time"></div></div><div class="lock-bottom"><div class="avatar">A</div><h2 id="lock-name">Your Space</h2><form id="unlock-form"><div class="unlock-field"><input id="unlock-pin" type="password" placeholder="Session code" autocomplete="off" aria-label="Session code"><button id="unlock-eye" type="button" aria-label="Show code" aria-pressed="false"></button></div><button type="submit" aria-label="Unlock">→</button></form><button id="unlock-direct">Open Session →</button><p id="lock-error"></p><small>Everything, right where you left it.</small></div></section><dialog id="dialog"><form method="dialog"><h3 id="dialog-title"></h3><p id="dialog-description"></p><input id="dialog-input" autocomplete="off"><div class="dialog-actions"><button value="cancel">Cancel</button><button id="dialog-ok" value="ok" class="primary">Confirm</button></div></form></dialog><input type="file" id="importer" multiple hidden></main><script type="module" src="app.js"></script></body></html>
